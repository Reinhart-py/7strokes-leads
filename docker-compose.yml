version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dashmin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/dashmin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/exports:/app/exports

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/workers/scraperWorker.js"]
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/dashmin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret
      PROXY_URL: ${PROXY_URL:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/exports:/app/exports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data:
